# CI: the gates this repo already enforces locally, run for every push and PR.
#
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2025-2026 Marcus Neves

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # ast-grep, skills-ref and marked are devDependencies locked with sha512 integrity in tools/bun.lock.
      - name: Install locked tools
        working-directory: tools
        run: |
          bun install --frozen-lockfile
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Fail on any advisory in the locked tools
        working-directory: tools
        run: bun audit

      - name: Skill layout (what `npx skills add mneves75/skills` discovers)
        run: |
          set -euo pipefail
          test ! -f SKILL.md  # a root SKILL.md would shadow every skill below it
          for dir in skills/*/; do
            name=$(basename "$dir")
            f="$dir/SKILL.md"
            test -f "$f" || { echo "$dir: missing SKILL.md"; exit 1; }
            grep -qx "name: $name" "$f" || { echo "$f: frontmatter name must be '$name'"; exit 1; }
            grep -qE '^description: .{20,}' "$f" || { echo "$f: missing/short description"; exit 1; }
          done

      - name: Agent Skills spec (skills-ref validate)
        run: |
          set -euo pipefail
          for d in skills/*/; do skills-ref validate "$d"; done

      - name: Collection skills (name == directory, Agent Skills spec, sync outputs present)
        run: |
          set -euo pipefail
          for c in collections/*/; do
            test -f "$c/UPSTREAM" && test -f "$c/LICENSE" || { echo "$c: missing UPSTREAM or LICENSE"; exit 1; }
            for dir in "$c"skills/*/; do
              name=$(basename "$dir")
              grep -qx "name: $name" "$dir/SKILL.md" || { echo "$dir/SKILL.md: frontmatter name must be '$name'"; exit 1; }
              skills-ref validate "$dir"
            done
          done

      - name: Collection sync e2e (fixture repo, no network)
        run: bash tools/scripts/sync-pstack.test

      - name: Shell syntax
        run: bash -n skills/mneves-fable-orchestrator/tools/codex-lane skills/mneves-fable-orchestrator/tools/codex-lane.test .githooks/pre-commit .githooks/pre-commit.test tools/scripts/build-site.sh tools/scripts/build-site.test tools/scripts/check-site-copy.sh tools/scripts/check-defaults-block.sh tools/scripts/sync-pstack.sh tools/scripts/sync-pstack.test skills/mneves-ship-deploy/assets/release.sh skills/mneves-ship-deploy/assets/verify-live.sh skills/mneves-ship-deploy/assets/release-guards.test.sh skills/autoreview/scripts/test-review-harness

      - name: codex-lane e2e (fake codex, no provider calls)
        run: bash skills/mneves-fable-orchestrator/tools/codex-lane.test

      - name: Landing copy controller syntax
        run: node --check site/copy-command.js

      - name: Release contract check (planted violations, read-only)
        run: python3 skills/mneves-ship-deploy/scripts/run-tests.py

      - name: Reference release guards (throwaway repo, fake wrangler, no network)
        run: bash skills/mneves-ship-deploy/assets/release-guards.test.sh

      - name: Readiness catalog (preservation map and planted violations)
        run: bash tools/scripts/check-readiness-catalog.test
      - name: SRS helper (concurrent reviews, temporary SQLite)
        run: python3 skills/mneves-teach-back-srs/tests/test_srs_db.py

      - name: Model ids live only in the orchestrator's Defaults block
        run: |
          bash tools/scripts/check-defaults-block.sh
          bash tools/scripts/check-defaults-block.test

      - name: Python syntax
        run: python3 -m py_compile skills/mneves-teach-back-srs/scripts/srs_db.py tools/scripts/check-html-active.py tools/scripts/changelog-rows.py skills/mneves-ship-deploy/scripts/release-contract-check.py skills/mneves-ship-deploy/scripts/run-tests.py skills/mneves-ship-deploy/tests/test_release_contract_check.py tools/scripts/check-readiness-catalog.py skills/autoreview/scripts/test-review-harness.py

      - name: Security audit validator suites and syntax
        run: |
          node --check skills/security-audit/validate-findings.cjs
          node --check skills/security-audit/validate-coverage-ledger.cjs
          node skills/security-audit/validate-findings.test.cjs
          node skills/security-audit/validate-coverage-ledger.test.cjs

      - name: Verified cccc install and real CLI controls (disposable fixtures)
        run: |
          python3 skills/autoreview/scripts/install-cccc.py "$RUNNER_TEMP/cccc"
          python3 skills/autoreview/scripts/check-cccc.py "$RUNNER_TEMP/cccc"

      - name: ast-grep scan
        run: ast-grep scan --config sgconfig.yml .

      - name: Pre-commit hook test
        run: bash .githooks/pre-commit.test

      - name: Generated site files are current
        run: |
          bash tools/scripts/build-site.test
          tools/scripts/build-site.sh
          git diff --exit-code -- site/ || { echo "run tools/scripts/build-site.sh and commit"; exit 1; }

      - name: tools typecheck + lint
        working-directory: tools
        run: |
          bun run typecheck
          bun run lint
          bun test

  render-starters:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install document engines and preview fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc poppler-utils libreoffice-writer fonts-liberation fonts-dejavu python3-venv libpango-1.0-0
          python3 -m venv .scratch/render-engine
          .scratch/render-engine/bin/pip install --require-hashes -r .github/requirements/render-starters.txt
          echo "$PWD/.scratch/render-engine/bin" >> "$GITHUB_PATH"
      - name: Reject active content through actual Pandoc commands
        run: python3 skills/mneves-render/tests/test_check_ast.py
      - name: Render and check HTML, DOCX and PDF starters
        run: python3 skills/mneves-render/tests/test_starters.py --require-office --artifacts .scratch/render-acceptance
      - name: Retain document previews for visual acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-acceptance
          path: .scratch/render-acceptance
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  autoreview:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Portable review and security tests (no provider calls)
        run: python skills/autoreview/scripts/run-tests.py
